[package]
name = "addok-core"
description = "addok-rs's engine: the index, the search and reverse geocoding, no I/O"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytemuck = "1.25.2"
deunicode = "1.6.2"
fancy-regex = "0.19.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

[dev-dependencies]
flate2 = "1.1.10"
serde_json = { version = "1.0.151", features = ["float_roundtrip", "preserve_order"] }
