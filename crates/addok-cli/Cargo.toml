[package]
name = "addok-cli"
description = "addok-rs's command line: builds the index file, geocodes Parquet or CSV files, serves /batch, addok-csv's /search/csv and /health over it"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
addok-core = { version = "0.7.0", path = "../addok-core" }
arrow = { version = "60.0.0", default-features = false }
axum = { version = "0.8.9", features = ["multipart"] }
bytes = "1.12.1"
fancy-regex = "0.19.2"
flate2 = "1.1.10"
memmap2 = "0.9.11"
parquet = "60.0.0"
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
